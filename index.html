const cam = { cx:180, cy:250, f:300, yaw:0, pitch:0, pos:[0,0,0], blend:0, blendTarget:0,
  follow:  { offset:.3, dist:11, height:2.6, lookY:.9, f:300, cy:245, heading:0, headingTarget:0, mx:0, mz:0, fixX:0, target:{} },
  overview:{ pos:[8, 12, PA_D+13], look:[0, 0, PA_D/2-1], f:380, cy:215 } };
const figs = START.map(x=>{ const f=newFig('red', x, 0, 0, 'stand'); f.style='jog'; return f; });
figs.push(Object.assign(newFig('red', -7.5, 3.5, PI/2, 'stand'), { style:'jog', hidden:true }));   // 5th player (Ex 4) waits off the area
const shown = ()=>figs.filter(f=>!f.hidden);
const coach = newFig('coach', 0, COACH_Z, PI, 'stand');
coach.rate = 10;
const pool = makePool('pool', 260);
const shadows = makeShadows('shadows', figs.length+1+PAIRS.length);   // then the coach's, then one per ball
const ballShadows = makeShadows('shadows', figs.length);              // each player's own ball (Ex 6)
const callEl = document.getElementById('call');
const labelEls = LABELS.map(L=>{
  const el=document.createElementNS(SVGNS,'text');
  el.setAttribute('class', L.cls); el.textContent=L.text;
  document.getElementById('labels').appendChild(el);
  return el;
});
let guideOn = false, repsOn = 0, coachOn = false, ballsOn = false;
const tunMem = {};   // tunnel ball: remembers where each roll was released
const camFigs = ph=>ph.focus ? ph.focus.map(i=>figs[i]) : shown();

function applyScene(idx, t, snap){
  const ph=phases[idx];
  guideOn = ph.guide||false;
  coachOn = !!PARTS[ph.part].coach;
  if(coachOn){ const at=PARTS[ph.part].coachAt||[0, COACH_Z]; coach.x=at[0]; coach.z=at[1]; coach.mv=null; }   // coach's spot for this part
  ballsOn = !!ph.ball;
  document.getElementById('ff').textContent = `⏩ ${ph.speed||3}× speed`;
  cam.follow.fixX = ph.focus ? null : 0;   // focus: centre the camera on those players
  const lab=document.getElementById('labels');
  if(ph.labels) retrigger(lab,'show'); else lab.classList.remove('show');
  document.getElementById('ff').classList.toggle('show', !!ph.ff);
  document.getElementById('reps').classList.toggle('show', !!ph.reps);
  repsOn = ph.reps||0;
  cam.follow.headingTarget = ph.view;
  cam.follow.target = { ...FOLLOW, ...(ph.follow||{}) };
  cam.blendTarget = ph.cam==='follow' ? 1 : 0;
  figs.forEach((f,i)=>{
    // players beyond this part's count stand aside, hidden, until a part needs them
    f.hidden = i>=partPlayers(ph);
    if(f.hidden){ f.mv=null; f.sk=null; f.al=null; f.call=null; f.sig=null; f.thr=null; f.ps=null; f.tv=null; f.pb=null; f.dr=null; f.tun=null; f.tmode=null; f.poseFn=null; f.plant=0; return; }
    f.holdBall = !!ph.holdBall;   // ball held in both hands
    f.oneHand = ph.oneHand ?? null;   // ball balanced on one hand (1 = right, 0 = left)
    const s = { x:(ph.xs||START)[i], z:ph.zs ? ph.zs[i] : ph.z, face:ph.faces ? ph.faces[i] : ph.face, idle:ph.idle };
    // al + keep: the alertness set already under way carries on (speed can change)
    if(!snap && ph.al && ph.keep && f.al){ f.al.speed=f.idleSpeed=ph.speed||1; return; }
    // tun + keep: the tunnel script carries on (speed can change)
    if(!snap && ph.tun && ph.keep && f.tun){ f.tun.speed=ph.speed||1; return; }
    // hop + keep: the jump set carries on (speed can change)
    if(!snap && ph.hop && ph.keep && f.hp){ f.hp.speed=ph.speed||1; return; }
    // spd + keep: the Spiderman set carries on (speed can change)
    if(!snap && ph.spd && ph.keep && f.spd){ f.spd.speed=ph.speed||1; return; }
    // fa + keep: the forearm press-up set carries on (speed can change)
    if(!snap && ph.fa && ph.keep && f.fa){ f.fa.speed=ph.speed||1; return; }
    if(!snap && ph.f8 && ph.keep && f.f8){ f.f8.speed=ph.speed||1; return; }
    // st6 + keep: the Spiderman stretch set carries on
    if(!snap && ph.st6 && ph.keep && f.st6){ f.st6.speed=ph.speed||1; return; }
    // roll + keep: the rolls carry on (speed can change)
    if(!snap && ph.roll && ph.keep && f.rl){ f.rl.speed=ph.speed||1; return; }
    // thr on the same leg: the throwing set carries on; go:true starts it if it hasn't started yet
    // ps on the same leg: the passing set carries on; go:true starts it if it hasn't started yet
    if(!snap && ph.pb && f.pb && f.pb.st===ph.pb.st){
      if(ph.pb.go && !f.pb.go){ f.pb.go=true; f.pb.t0=t+(ph.delay||0); }
      f.pb.speed=ph.speed||1;
      return;
    }
    if(!snap && ph.tv && f.tv && f.tv.st===ph.tv.st){
      if(ph.tv.go && !f.tv.go){ f.tv.go=true; f.tv.t0=t+(ph.delay||0); }
      f.tv.speed=ph.speed||1;
      return;
    }
    if(!snap && ph.ps && f.ps && f.ps.st===ph.ps.st){
      if(ph.ps.go && !f.ps.go){ f.ps.go=true; f.ps.t0=t+(ph.delay||0); }
      f.ps.speed=ph.speed||1;
      return;
    }
    if(!snap && ph.thr && f.thr && f.thr.st===ph.thr.st){
      if(ph.thr.go && !f.thr.go){ f.thr.go=true; f.thr.t0=t+(ph.delay||0); }
      f.thr.speed=ph.speed||1;
      return;
    }
    if(f.idle!==s.idle) f.idleClock=0;
    f.face=s.face; f.idle=s.idle; f.rate=ph.rate; f.style=ph.style||'jog'; f.idleSpeed=1;
    f.thr = ph.thr && !snap ? { st:ph.thr.st, isA:i%2===0, go:!!ph.thr.go, t0:t+(ph.delay||0), speed:ph.speed||1, prog:THR.AR, ph:i*1.7 } : null;
    f.ps = ph.ps && !snap ? { st:ph.ps.st, isA:i%2===0, go:!!ph.ps.go, t0:t+(ph.delay||0), speed:ph.speed||1, prog:0, ph:i*1.7, foot:-.05 } : null;
    f.tv = ph.tv && !snap ? { st:ph.tv.st, isA:i%2===0, go:!!ph.tv.go, t0:t+(ph.delay||0), speed:ph.speed||1, prog:0, ph:i*1.7 } : null;
    if(ph.pb && !snap){   // Ex 3: each player's spot and the direction to the partner
      const j=i^1, ox=(ph.xs)[j]-s.x, oz=(ph.zs ? ph.zs[j] : ph.z)-s.z, L=Math.hypot(ox,oz)||1;
      f.pb={ st:ph.pb.st, isA:i%2===0, go:!!ph.pb.go, t0:t+(ph.delay||0), speed:ph.speed||1, prog:0, x0:s.x, z0:s.z, u:[ox/L, oz/L], ph:i*1.3 };
    } else f.pb=null;
    f.poseFn = f.thr ? thrPose : f.ps ? psPose : f.tv ? tvPose : f.pb ? pbPose : null;
    f.tun=null; f.tmode=null; f.plant=0; f.hp=null; f.spd=null; f.pinW=null; f.rl=null; f.rollRot=null; f.rollPath=null; f.armW=null; f.around=null; f.customJ=null; f.fa=null; f.st6=null; f.f8=null;
    if(ph.roll && !snap){   // 10 sideways rolls from this spot, alternating right and left
      f.mv=null; f.sk=null; f.act=null; f.al=null; f.call=null; f.sig=null;
      f.rl={ t0:t+(ph.delay||0), x0:f.x, z0:f.z, prog:0, speed:ph.speed||1, lag:i*.25 };
      return;
    }
    const keepBall = ph.drib && f.dr && f.ballW && !snap;   // Level 5 Ex 1: the dribbled ball carries on into the next phase
    f.ballW = keepBall ? f.ballW : ph.restBalls ? [s.x, SPD.BR, s.z+SPD.BALL] : null;   // own ball waiting in front of the feet
    f.dr = ph.drib && f.ballW ? (keepBall ? f.dr : { x:f.ballW[0], z:f.ballW[2], vx:0, vz:0, px:null, pz:null, stopN:-1 }) : null;
    if(ph.faBalls) f.ballW=[s.x, FA.BR, s.z+FA.BALL];               // Ex 4: ball waiting where the shins will go
    if(ph.fa && !snap){   // Ex 4: forearm press-up set from this spot
      f.mv=null; f.sk=null; f.act=null; f.al=null; f.call=null; f.sig=null;
      f.fa={ t0:t+(ph.delay||0), prog:FA.PRE, speed:ph.speed||1, lag:(3-i)*.25 };   // close-up player (3) leads
      return;
    }
    if(ph.f8Balls) f.ballW=[s.x, TUN.BR, s.z+HB.ZB];             // Ex 4: ball waiting in front
    if(ph.f8 && !snap){   // Ex 4: press-up figure-eight set from this spot
      f.mv=null; f.sk=null; f.act=null; f.al=null; f.call=null; f.sig=null;
      f.f8={ t0:t+(ph.delay||0), x0:f.x, z0:f.z, prog:F8.PRE, speed:ph.speed||1, lag:(3-i)*.2, endMover:0 };
      return;
    }
    if(ph.st6 && !snap){  // Ex 6: Spiderman stretch set from where the player stands
      f.mv=null; f.sk=null; f.act=null; f.al=null; f.call=null; f.sig=null;
      f.st6={ t0:t+(ph.delay||0), x0:f.x, footZ:f.z, prog:SPD.PRE, speed:ph.speed||1, lag:i*.2 };
      return;
    }
    if(ph.spd && !snap){   // Spiderman set from where the player stands (feet stay on this spot)
      f.mv=null; f.sk=null; f.act=null; f.al=null; f.call=null; f.sig=null;
      f.spd={ t0:t+(ph.delay||0), x0:f.x, footZ:f.z, prog:SPD.PRE, speed:ph.speed||1, lag:i*.2 };
      return;
    }
    if(ph.hop && !snap){   // a set of single-leg jumps from where the player stands, right leg first
      f.mv=null; f.sk=null; f.act=null; f.al=null; f.call=null; f.sig=null;
      f.hp={ t0:t+(ph.delay||0), x0:f.x, f0:f.z+ankZ(HOPP.hold(1),1), s0:1, speed:ph.speed||1, prog:-HP.CALL };
      return;
    }
    if(snap){ f.x=s.x; f.z=s.z; f.mv=null; f.act=null; f.sk=null; f.al=null; f.call=null; f.sig=null; f.yaw=s.face; f.idleClock=0; f.q=pose[s.idle](0); return; }
    if(ph.tun){
      f.mv=null; f.sk=null; f.act=null; f.al=null; f.call=null; f.sig=null; f.pi=i;
      f.tun={ t0:t+(ph.delay||0), prog:ph.tun.from||0, speed:ph.speed||1 };
      tunMem.rk=-1;
      f.poseFn=tunPose;
      return;
    }
    if(ph.al){
      f.mv=null; f.sk=null; f.act=null;
      f.al={ t0:t+(ph.delay||0), z0:f.z, calls:ph.al, speed:ph.speed||1, prog:0 };
      f.idleSpeed=ph.speed||1;
      return;
    }
    f.al=null; f.call=null; f.sig=null;
    // skate: a set of skating jumps from where the player stands; keep phases let it run on
    // (and can change its speed), they never start a new set
    if(ph.skate){
      if(ph.keep && f.sk){ f.sk.speed=ph.speed||1; return; }
      f.mv=null;
      f.sk={ t0:t+(ph.delay||0), x0:LANES[i], z0:f.z, s0:1, jumps:ph.skate, speed:ph.speed||1, prog:0 };
      return;
    }
    f.sk=null; f.act=null;
    if(ph.keep && f.mv && f.mv.to[1]===s.z) return;
    f.mv = { from:[f.x,f.z], to:[s.x,s.z], t0:t+(ph.delay||0), dur:ph.dur||Math.max(.6, Math.hypot(s.x-f.x, s.z-f.z)/2.6) };
  });
  if(snap){
    cam.follow.heading=ph.view; cam.blend=cam.blendTarget;
    setCam(cam, lookCam(cam.overview), followCam(cam.follow, camFigs(ph), 0, true), cam.blend);
  }
  return ph.hold ?? (ph.delay||0)+(ph.dur||0)+1.7;   // seconds until Auto advances
}

function updateScene(t, dt){
  shown().forEach(f=>updateFig(f, t, dt));
  coach.idle = figs[0].sig || (figs[0].call ? 'call' : 'stand');   // the signal pose while it's given
  updateFig(coach, t, dt);
  cam.blend += clamp(cam.blendTarget-cam.blend, -dt/1.4, dt/1.4);   // 1.4 s crane up/down
  setCam(cam, lookCam(cam.overview), followCam(cam.follow, camFigs(phases[current]), dt, false), cam.blend);
}

function renderScene(){
  document.getElementById('ground').setAttribute('d', `M0 ${horizonY(cam).toFixed(1)}H360V400H0Z`);
  let st='';
  for(let z=0; z<HALF_Z+40; z+=4) st += polyD(cam, quad(-TOUCH_X, z, TOUCH_X, Math.min(z+2, HALF_Z+40)));
  document.getElementById('stripes').setAttribute('d', st);
  document.getElementById('field').setAttribute('d', FIELD.map(q=>polyD(cam,q)).join(''));
  document.getElementById('area').setAttribute('d', polyD(cam, quad(-AW, 0, AW, PA_D)));
  document.getElementById('areaLine').setAttribute('d',
    lineD(cam,[-AW,0,0],[AW,0,0]) + lineD(cam,[AW,0,0],[AW,0,PA_D]) +
    lineD(cam,[AW,0,PA_D],[-AW,0,PA_D]) + lineD(cam,[-AW,0,PA_D],[-AW,0,0]));
  LABELS.forEach((L,i)=>{
    const s=project(cam, L.at), el=labelEls[i];
    if(s[2]<.6 || (L.part && L.part!==phases[current].part)){ el.setAttribute('x',-999); return; }
    el.setAttribute('x', s[0].toFixed(1)); el.setAttribute('y', s[1].toFixed(1));
  });

  // Coach's call, above the coach's head
  const call = coachOn && figs[0].call, cs = project(cam, [coach.x, 2.25, coach.z]);
  if(call && cs[2]>.6){
    callEl.textContent=call; callEl.setAttribute('x', clamp(cs[0], 40, 320).toFixed(1)); callEl.setAttribute('y', Math.max(22, cs[1]).toFixed(1));
  } else callEl.setAttribute('x', -999);

  // Coach's direction: dashed arrow on the ground from each player's spot to the next landing spot
  let dd='', hd='';
  figs.forEach(f=>{
    const a=skateArrow(f) || hopArrow(f); if(!a) return;
    const dx=a[1][0]-a[0][0], dz=a[1][1]-a[0][1], L=Math.hypot(dx,dz), ux=dx/L, uz=dz/L;
    const s=[a[0][0]+ux*.3, 0, a[0][1]+uz*.3], e=[a[1][0]-ux*.35, 0, a[1][1]-uz*.35];
    dd += lineD(cam, s, e);
    hd += polyD(cam, [[e[0]+ux*.3,0,e[2]+uz*.3], [e[0]-uz*.16,0,e[2]+ux*.16], [e[0]+uz*.16,0,e[2]-ux*.16]]);
  });
  document.getElementById('dirs').setAttribute('d', dd);
  document.getElementById('dirHeads').setAttribute('d', hd);

  const items=[];
  CONES.forEach(c=>{ const it=coneItem(cam,c[0],c[1]); if(it) items.push(it); });
  if(repsOn){
    const S=figs[0].sk, A=figs[0].al, T=figs[0].thr, U=figs[0].tun, H=figs[0].hp, P=figs[0].spd, el=document.getElementById('reps');
    const RLs=figs[0].rl;
    if(RLs){   // roll counter: goes up as each roll finishes
      const n = rlDone(RLs.prog);   // completed rolls
      el.textContent = `Rolls · Right ${Math.ceil(n/2)} · Left ${Math.floor(n/2)}`;
    } else if(figs[0].st6){   // distance counter (Ex 6 crab walk)
      const d=crBody(figs[0].st6.prog-figs[0].st6.lag-CB.ON);
      el.textContent=`Set ${repsOn} · ${d.toFixed(1)} / ${CR.DIST} m`;
    } else if(figs[0].fa || figs[0].f8){   // set timer (Ex 4)
      const pr=(figs[0].fa||figs[0].f8).prog, L=figs[0].fa ? FA.SET : F8.SET;
      el.textContent=`Set ${repsOn} · ${clamp(Math.floor(pr), 0, L)} / ${L} s`;
    } else if(P){   // set timer
      el.textContent=`Set ${repsOn} · ${clamp(Math.floor(P.prog), 0, SPD.SET)} / ${SPD.SET} s`;
    } else if(H){   // jump counter: goes up as each landing happens
      const n = clamp(Math.floor((H.prog-HP.LOAD-HP.AIR)/HP.T)+1, 0, HP.N);
      el.textContent=`Set ${repsOn} · ${n<HP.PER || (n===HP.PER && H.prog<HP.PER*HP.T) ? 'Right' : 'Left'} leg · Jump ${n} / ${HP.N}`;
    } else if(U){   // roll counter: goes up as each ball is released
      const r = clamp(Math.floor((U.prog-1)/TUN.TT)+1, 0, TUN.N);
      el.textContent = `Set ${repsOn} · Roll ${r} / ${TUN.N}`;
    } else if(figs[0].pb){   // set timer and points
      const Pb=figs[0].pb, G=pbState(Math.min(Pb.prog, PB.SET));
      el.textContent=`${Pb.st ? 'Right' : 'Left'} leg · ${clamp(Math.floor(Pb.prog), 0, PB.SET)} / ${PB.SET} s · Points ${G.score[0]}–${G.score[1]}`;
    } else if(figs[0].tv){   // throw counter: goes up as each volley is caught
      const Tv=figs[0].tv, c=Math.floor((Tv.prog-TV.CATCH)/TV.CYC)+1, n=clamp(c>TV.PER ? c-1 : c, 0, 2*TV.PER);
      el.textContent=`${Tv.st ? 'Right' : 'Left'} leg · Throw ${n} / ${2*TV.PER}`;
    } else if(figs[0].ps){   // pass counter: goes up as each pass arrives
      const Ps=figs[0].ps, n = clamp(Math.floor((Ps.prog-PS.KICK-PS.ROLL)/PS.CYC)+1, 0, PS.N);
      el.textContent=`${Ps.st ? 'Right' : 'Left'} leg · Pass ${n} / ${PS.N}`;
    } else if(T){   // throw counter: goes up as each catch happens
      const n = clamp(Math.floor((T.prog-THR.REL-THR.FLY)/THR.CYC)+1, 0, THR.N);
      el.textContent=`${T.st ? 'Right' : 'Left'} leg · Throw ${n} / ${THR.N}`;
    } else if(A){   // stop counter: goes up as each stop happens
      const n = clamp(Math.floor((A.prog-AL.RUN)/(AL.RUN+AL.HOLD))+1, 0, A.calls.length);
      el.textContent=`Set ${repsOn} · Stop ${n} / ${A.calls.length}`;
    } else { // jump counter: goes up as each landing happens
      const n = S ? clamp(Math.floor((S.prog-SK.LOAD-SK.AIR)/SK.T)+1, 0, S.jumps) : J;
      el.textContent=`Set ${repsOn} · Jump ${n} / ${J}`;
    }
  }

  // Alignment guide on the player nearest the camera
  let near=null, nd=1e9;
  shown().forEach(f=>{ const d=toCam(cam,[f.x,1,f.z])[2]; if(d<nd){ nd=d; near=f; } });
  figs.forEach((f,i)=>{
    const bs=ballShadows[i];
    if(f.hidden){ shadows[i].setAttribute('rx', 0); bs.setAttribute('rx', 0); return; }
    if(ballsOn && f.oneHand!=null){   // ball sitting on the outstretched palm
      const J=fk(f.q), h=J['hand'+f.oneHand], e=J['el'+f.oneHand], d=sub3(h,e), L=Math.hypot(...d)||1;
      const p=worldOf(f, [h[0]+d[0]/L*.06, h[1]+.12, h[2]+d[2]/L*.06]);   // on the palm, just past the wrist
      ballItems(cam, p, items); placeShadow(cam, bs, p[0], p[2], .12, Math.max(0, p[1]-.1)*.6);
    }
    else if(ballsOn && f.holdBall){ const p=handsMid(f); ballItems(cam, p, items); placeShadow(cam, bs, p[0], p[2], .12, Math.max(0, p[1]-.1)*.6); }   // ball in both hands
    else if(ballsOn && f.ballW){ ballItems(cam, f.ballW, items); placeShadow(cam, bs, f.ballW[0], f.ballW[2], .12, 0); }   // player's own ball
    else bs.setAttribute('rx', 0);
    figureItems(cam, f, items, guideOn && f===near ? guideOn : false);
    placeShadow(cam, shadows[i], f.x, f.z, .36, f.lift);
  });
  PAIRS.forEach((P,k)=>{
    const A=figs[P.a], el=shadows[figs.length+1+k];
    if(!ballsOn || !(A.thr || A.ps || A.tv)){ el.setAttribute('rx', 0); return; }
    const p=A.ps ? psBall(P, A, figs[P.b]) : A.tv ? tvBall(P, A, figs[P.b]) : ballPos(P, A, figs[P.b]);
    ballItems(cam, p, items);
    placeShadow(cam, el, p[0], p[2], .12, Math.max(0, p[1]-.1)*.6);
  });
  if(ballsOn && figs[0].tun){
    const p=tunBall(figs[0].tun.prog, tunMem), el=shadows[figs.length+1];
    ballItems(cam, p, items);
    placeShadow(cam, el, p[0], p[2], .12, Math.max(0, p[1]-.1)*.6);
  }
  const cShadow = shadows[figs.length];
  if(coachOn){ figureItems(cam, coach, items, false); placeShadow(cam, cShadow, coach.x, coach.z, .36, coach.lift); }
  else cShadow.setAttribute('rx', 0);
  drawItems(pool, items);
}

// ╔══════════════════════════════════════════════════════════════════╗
// ║  UI                                                              ║
// ╚══════════════════════════════════════════════════════════════════╝
let current=0, isAuto=false, timer=null;
const now = ()=>performance.now()/1000;
// ── Voiceover: the device reads each step aloud (Web Speech API). Auto waits for the sentence to finish ──
// Spoken text = ph.say, else ph.desc; the first step of each part opens with the exercise name.
const VO = { on:false, ok:typeof speechSynthesis!=='undefined' && typeof SpeechSynthesisUtterance!=='undefined', voice:null, done:true, doneAt:0, endAt:0 };
function pickVoice(){   // the most natural English voice the device has
  const vs = VO.ok ? speechSynthesis.getVoices() : [];
  const score = v=>(/premium|enhanced|natural|neural|online/i.test(v.name) ? 4 : 0) +
    (/samantha|ava|allison|aria|jenny|google us english|google uk english female|daniel|serena|karen/i.test(v.name) ? 2 : 0) + (/en[-_]US/i.test(v.lang) ? 1 : 0);
  VO.voice = vs.filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a))[0] || null;
}
if(VO.ok){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// Calm delivery: a little slower than normal speech, one sentence at a time with a short breath between
const VO_RATE = .86, VO_GAP = .55;
function sayText(i){
  const ph=phases[i], txt=k=>phases[k].say ?? phases[k].desc;
  if(i && txt(i)===txt(i-1)) return '';   // same sentence as the step before: not said twice
  let s = txt(i);
  // each exercise is named on its first step: "Exercise 1. Alertness Running Game."
  if(phases.findIndex(p=>p.part===ph.part)===i){ const m=(PARTS[ph.part].title||'').match(/Ex(?:ercise)?\s*(\d+)/); s = `${m ? 'Exercise '+m[1]+'. ' : ''}${PARTS[ph.part].name}. ${s}`; }
  return s.replace(/(\d)\s*–\s*(\d)/g, '$1 to $2').replace(/°/g, ' degrees').replace(/\s*×\s*/g, ' by ')
          .replace(/(\d)v(\d)/g, '$1 v $2').replace(/(\d) m\b/g, '$1 metres').replace(/(\d)-yds?\b/g, '$1 yard').replace(/(\d)\s*yds?\b/g, '$1 yards').replace(/\s*&\s*/g, ' and ').replace(/\bmax\b/g, 'maximum').replace(/\s*—\s*/g, ', ');
}
function speak(i){
  if(!VO.on || !VO.ok) return;
  hush(); VO.on=true;
  const text = sayText(i), parts = (text.match(/[^.!?:]+[.!?:]*/g)||[]).map(s=>s.trim()).filter(Boolean);
  const run = {};  VO.run = run;
  VO.done=false; VO.endAt = now() + text.split(/\s+/).length/(2.5*VO_RATE) + parts.length*VO_GAP + 2;   // in case the device never reports the end
  const say = k=>{
    if(VO.run!==run) return;
    if(k>=parts.length){ VO.done=true; VO.doneAt=now(); return; }
    const u = new SpeechSynthesisUtterance(parts[k]);
    if(VO.voice){ u.voice=VO.voice; u.lang=VO.voice.lang; } else u.lang='en-US';
    u.rate=VO_RATE; u.pitch=.98;
    u.onend = u.onerror = ()=>{ if(VO.run===run) VO.gapT=setTimeout(()=>say(k+1), VO_GAP*1000); };
    VO.u=u; speechSynthesis.speak(u);
  };
  say(0);
}
function hush(){ if(VO.ok) speechSynthesis.cancel(); clearTimeout(VO.gapT); VO.run=null; VO.done=true; VO.u=null; }
// still talking (or just finished: a short beat before the next step)
const talking = ()=>VO.on && ((!VO.done && now()<VO.endAt) || now()-VO.doneAt < .9);
function toggleVoice(){
  VO.on=!VO.on;
  const b=document.getElementById('voiceBtn');
  b.classList.toggle('on', VO.on); b.textContent = VO.on ? '🔊 Voiceover: On' : '🔈 Voiceover: Off';
  if(VO.on) speak(current); else hush();
}
if(!VO.ok) document.getElementById('voiceRow').style.display='none';

function retrigger(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function applyPhase(idx, snap){
  const ph=phases[idx], dur=applyScene(idx, now(), snap);
  const P=PARTS[ph.part], name=document.getElementById('partName');
  if(name.dataset.part!==ph.part){
    name.dataset.part=ph.part;
    document.getElementById('partTitle').textContent=P.title;
    name.innerHTML=`${P.name}<span class="part-time">${P.time}</span>`; retrigger(name,'show');
  }
  const cue=document.getElementById('cue'), card=document.getElementById('card');
  if(ph.cue){ cue.textContent=ph.cue; retrigger(cue,'show'); } else cue.classList.remove('show');
  // card = { k: small red heading, big: main line, sub: detail } — replaces animating repeat sets
  if(ph.card){
    card.innerHTML=`<div class="k">${ph.card.k}</div><div class="big">${ph.card.big}</div><div class="sub">${ph.card.sub}</div>`;
    retrigger(card,'show');
  } else card.classList.remove('show');
  document.getElementById('desc').textContent=ph.desc;
  document.querySelectorAll('.step-dot').forEach((d,i)=>{
    d.classList.toggle('active', i===idx);
    d.classList.toggle('done',   i<idx);
  });
  document.getElementById('prevBtn').style.opacity = idx===0 ? '0.3':'1';
  document.getElementById('nextBtn').style.opacity = idx===phases.length-1 ? '0.3':'1';
  speak(idx);
  return dur;
}

function changePhase(dir){
  const next=clamp(current+dir, 0, phases.length-1);
  if(next!==current){ current=next; applyPhase(current); }
}

// Auto: each phase says how long to wait before the next (cues can change mid-set)
function scheduleNext(wait){
  timer=setTimeout(function go(){
    if(talking()){ timer=setTimeout(go, 150); return; }   // voiceover: let the sentence finish
    if(current<phases.length-1){ current++; scheduleNext(applyPhase(current)); }
    else stopAuto();
  }, Math.max(2600, wait*1000));
}
function toggleAuto(){
  if(isAuto){ stopAuto(); hush(); return; }
  isAuto=true;
  document.getElementById('playBtn').textContent='⏸ Pause';
  if(current===phases.length-1){ current=0; applyPhase(0, true); }
  scheduleNext(0);
}
function stopAuto(){
  isAuto=false; clearTimeout(timer);
  document.getElementById('playBtn').textContent='▶ Auto';
}

let last=now();
function frame(){
  const t=now(), dt=clamp(t-last, 1/240, .05); last=t;
  updateScene(t, dt); renderScene();
  requestAnimationFrame(frame);
}

phases.forEach((ph,i)=>{
  const d=document.createElement('div');
  d.className = 'step-dot' + (i && ph.part!==phases[i-1].part ? ' gap' : '');
  document.getElementById('stepDots').appendChild(d);
});
applyPhase(0, true);
requestAnimationFrame(frame);
</script>
</body>
